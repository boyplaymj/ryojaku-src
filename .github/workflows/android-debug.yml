# 両雀 Android debug APK 建置
#
# 為什麼在 CI 而不是本機：官方 Android build-tools 沒有 Linux ARM64 版本。
# 實測（2026-08-09，SML 主機 aarch64）：
#   - repository2-3.xml 的 56 個 aarch64 條目 host-os 全是 macosx，Linux 一個都沒有
#   - build-tools_r35_linux.zip 裡 aapt / aapt2 / aidl / zipalign 都是 x86-64 ELF
#     （d8 與 apksigner 是 shell script 包 Java jar，那兩支反而跨平台可用）
#   - 直接執行 aapt2 → cannot execute binary file: Exec format error (rc=126)
#   - Amazon Linux 2023 也沒有 qemu-user-static 套件可裝
# 所以 Android 一律在 x86_64 runner 上建。repo 是 public → Actions 分鐘數免費不限。
#
# ⚠️ 這裡刻意複製了 frontend/deploy-stg.sh 的 bundle 位址護欄。不是為了整齊，
#    是因為 CI 是「產出手機上那份 binary」的地方 —— 護欄留在只跑網頁部署的腳本裡，
#    對 App 沒有任何保護作用。dist 一旦燒進 APK，位址就改不掉了。

name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest   # x86_64，這是重點

    env:
      # 自訂網域，與 frontend/deploy-stg.sh 保持一致。
      # ⚠️ 結尾「沒有」/stg —— base path mapping 掛在根，stage 由網域自己解析。
      # ⚠️ 絕不可換成 *.execute-api.* 原始位址：API Gateway 一重建 ID 就變，
      #    已安裝的 App 會同時變磚（下面的護欄會擋，含我方自己的 ID）。
      VITE_API_BASE_URL: https://ryojaku-api.boyplaymj.com
      VITE_WS_BASE_URL: wss://ryojaku-ws.boyplaymj.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # 2026-09-01 補。在此之前這個 workflow **完全沒有測試步驟** ——
      # utils/ 下的測試檔存在、在本機也是綠的，但沒有任何自動化流程會叫它們。
      # 而「測試全綠」與「測試從來沒被執行」在 CI log 上長得一模一樣：都沒有輸出。
      # 擺在 build 之前是為了快速失敗；npm test 會自己印出它挑了哪一版 node。
      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build web bundle
        working-directory: frontend
        run: npm run build

      # 出貨前自我驗證。三段都要有反面斷言 —— 只檢查「該有的有沒有」的話，
      # 一個什麼都沒烘進去的空 bundle 也可能矇混過去。
      - name: Verify bundle addresses
        working-directory: frontend
        run: |
          set -euo pipefail
          BUNDLE=$(ls dist/assets/*.js)
          echo "檢查對象：$BUNDLE"
          for want in ryojaku-api.boyplaymj.com ryojaku-ws.boyplaymj.com; do
            grep -q "$want" $BUNDLE || { echo "❌ bundle 沒烘進 $want" >&2; exit 1; }
          done
          if grep -qE "yg7y0xkb50|00pox0hvv4|5yas775i27|ek5dythoh9" $BUNDLE; then
            echo "❌ bundle 殘留工程師正式環境位址" >&2; exit 1
          fi
          if grep -q "execute-api" $BUNDLE; then
            echo "❌ bundle 殘留 execute-api 原始位址（App 重建 API 就變磚）" >&2; exit 1
          fi
          echo "✔ bundle 位址檢查通過"

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # 驗證 sync 真的把「這次」的 bundle 搬進去了，而不是沿用上一輪的殘留。
      # 只看 cap sync 印 "Sync finished" 是不夠的 —— 它複製 0 個檔也會這樣印。
      - name: Verify synced assets match this build
        working-directory: frontend
        run: |
          set -euo pipefail
          for f in dist/assets/*.js; do
            base=$(basename "$f")
            test -f "android/app/src/main/assets/public/assets/$base" \
              || { echo "❌ Android 專案內找不到本次產物 $base" >&2; exit 1; }
          done
          echo "✔ Android assets 與本次 build 一致"

      # ⚠️ 上一版直接呼叫裸的 `sdkmanager` 而失敗。ubuntu runner 的 Android SDK
      # 本來就預裝了多個 platform / build-tools，而 cmdline-tools 的 bin 不保證在 PATH 上。
      # 所以改成：先把實際看到的東西印出來，缺了才裝，且用絕對路徑呼叫。
      # （這裡刻意把診斷放在最前面 —— CI log 是這個 step 唯一的觀測管道。）
      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "--- 預裝 platforms ---";   ls "$ANDROID_HOME/platforms"   2>/dev/null || echo "(none)"
          echo "--- 預裝 build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(none)"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
          echo "sdkmanager=${SDKMANAGER:-<not found>}"
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "✔ 已有 android-35，不需安裝"
          else
            [ -n "$SDKMANAGER" ] || { echo "❌ 缺 android-35 且找不到 sdkmanager" >&2; exit 1; }
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 不只確認檔案存在 —— 讀出 APK 內的 package name 與版本，
      # 確認產出的真的是 com.boyplaymj.ryojaku（appId 拆人質那次的改動有沒有生效）。
      - name: Inspect APK
        working-directory: frontend/android
        run: |
          set -euo pipefail
          APK=$(find . -name '*-debug.apk' | head -1)
          echo "APK = $APK ($(du -h "$APK" | cut -f1))"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^application-label" || true
          # 取第一行並去掉尾隨空白／CR 再比對。原本用 grep -qx 對整段輸出比對，
          # 只要多吐一行或帶 \r 就會誤判成失敗 —— 那是斷言太脆，不是 build 壞掉。
          PKG=$("$AAPT2" dump packagename "$APK" | head -1 | tr -d '\r' | xargs)
          echo "package name = [$PKG]"
          [ "$PKG" = "com.boyplaymj.ryojaku" ] \
            || { echo "❌ package name 不是 com.boyplaymj.ryojaku" >&2; exit 1; }
          echo "✔ package name 正確"

          # 版本：拿「真的燒進 APK 的那個值」跟單一來源比對。
          # 為什麼不能只靠 npm run build 的 prebuild 守衛：那支比對的是 repo 裡的
          # **檔案內容**，證明不了 gradle 真的把那個值編進 APK —— 中間還隔著
          # flavor、manifestPlaceholders、以及「gradle 用了快取沒重編」這幾種可能，
          # 而那幾種失敗的外觀都是「build 成功」。這一段是唯一量到成品的檢查。
          BADGING=$("$AAPT2" dump badging "$APK")
          WANT=$(cd .. && node scripts/sync-version.mjs --json)
          WANT_NAME=$(printf '%s' "$WANT" | jq -r .version)
          WANT_CODE=$(printf '%s' "$WANT" | jq -r .buildNumber)
          # 不接 head —— 這裡在 pipefail 底下，head 提早關管線會讓上游拿到 SIGPIPE，
          # 於是「抽到了」會被回報成非零而看起來像抽不到。package: 只有一行，不需要 head。
          # ⚠️ 同一行還有 platformBuildVersionCode='35'。這裡靠**大小寫**區分：
          #    那個欄位是大寫 V（…VersionCode），比對字串是小寫 v ⇒ 貪婪 .* 抓不到它。
          #    所以這兩行絕對不可以加 sed -i／改成大小寫不敏感，會抽到 35。
          #    （就算真的抽錯，值也對不上來源 ⇒ 是 fail-closed，不會靜靜放行。）
          GOT_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          GOT_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
          echo "APK versionName=[$GOT_NAME] versionCode=[$GOT_CODE]／來源 [$WANT_NAME] [$WANT_CODE]"
          # 抽不到值要當失敗，不能當通過：badging 格式一改，兩邊都變空字串就會「相等」，
          # 那時候這道斷言會安靜地退化成永遠通過，外觀跟真的通過一模一樣。
          [ -n "$GOT_NAME" ] && [ -n "$GOT_CODE" ] && [ -n "$WANT_NAME" ] && [ -n "$WANT_CODE" ] \
            || { echo "❌ 版本抽取失敗，這道斷言無效（不是通過）" >&2; exit 1; }
          [ "$GOT_NAME" = "$WANT_NAME" ] \
            || { echo "❌ APK versionName=$GOT_NAME ≠ package.json 的 $WANT_NAME" >&2; exit 1; }
          [ "$GOT_CODE" = "$WANT_CODE" ] \
            || { echo "❌ APK versionCode=$GOT_CODE ≠ 推導值 $WANT_CODE" >&2; exit 1; }
          echo "✔ APK 版本與 package.json 一致"

      - uses: actions/upload-artifact@v4
        with:
          name: ryojaku-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
